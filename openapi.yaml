        schema:
          type: string
          format: uuid
    post:
      operationId: generateAndExecuteTextToSQL
      tags: [Postgres]
      summary: Generate SQL from natural language and execute it against the project's PostgreSQL instance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextToSQLRequest'
            example:
              question: "Show me the 10 most recent active users with email and created_at."
      responses:
        '200':
          description: SQL generated and executed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sql:
                            type: string
                          result:
                            $ref: '#/components/schemas/SQLQueryResult'
                          execution_id:
                            type: string
                            format: uuid
                          execution_time_ms:
                            type: integer
              example:
                status: success
                message: Query executed successfully
                data:
                  sql: "SELECT id, email, created_at FROM public.users WHERE status='active' ORDER BY created_at DESC LIMIT 10;"
                  execution_id: 8b3f0c1e-2a4d-4e1f-9c0b-111122223333
                  execution_time_ms: 12
                  result:
                    columns:
                      - id
                      - email
                      - created_at

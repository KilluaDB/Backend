openapi: 3.0.3
info:
  title: DBaaS Backend API
  version: 1.2.0
  description: |
    REST API for a database-as-a-service backend.
    PostgreSQL and MongoDB are namespaced under `/api/v1/projects/{id}/postgres/*`
    and `/api/v1/projects/{id}/mongodb/*`.

    Latest changes (v1.2.0):
    - Aligned with implementation: table delete is only via path
      `DELETE /projects/{id}/postgres/tables/{table}` (public schema).
    - Query execute and query history responses now documented as standard
      APIResponse (status, message, data) with result/history in `data`.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Projects
  - name: Postgres
  - name: MongoDB

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    APIResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
        data:
          type: object
          nullable: true
        error:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        error:
          type: string
          nullable: true

    AuthRegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthTokenResponse:
      type: object
      required: [user_id, access_token]
      properties:
        user_id:
          type: string
          format: uuid
          description: ID of the authenticated user
        access_token:
          type: string
          description: JWT access token

    Project:
      type: object
      required: [id, user_id, name, db_type, resource_tier, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        db_type:
          type: string
          enum: [sql, nosql]
          description: "'sql' uses PostgreSQL; 'nosql' uses MongoDB"
        resource_tier:
          type: string
          enum: [free, basic, premium]
        created_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required: [name, db_type]
      properties:
        name:
          type: string
          minLength: 1
          description: Project display name
        description:
          type: string
          nullable: true
          description: Optional; defaults to empty string if omitted
        db_type:
          type: string
          enum: [sql, nosql]
          description: "'sql' uses PostgreSQL; 'nosql' uses MongoDB"
        resource_tier:
          type: string
          enum: [free, basic, premium]
          default: free
          description: Optional; defaults to 'free' if omitted. Allowed values are 'free', 'basic', or 'premium'

    ExecuteSQLQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string

    SQLQueryResult:
      type: object
      required: [columns, rows, row_count, execution_time_ms]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        row_count:
          type: integer
        rows_affected:
          type: integer
        execution_time_ms:
          type: integer
        error:
          type: string
          nullable: true

    QueryHistoryItem:
      type: object
      required: [id, db_instance_id, user_id, query_text, executed_at]
      properties:
        id:
          type: string
          format: uuid
        db_instance_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        query_text:
          type: string
        executed_at:
          type: string
          format: date-time
        success:
          type: boolean
          nullable: true
        execution_time_ms:
          type: integer
          nullable: true

    User:
      type: object
      required: [id, email, role, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, deleted]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: New email for the user
        role:
          type: string
          enum: [user, admin]
          description: New role; only admins may change roles

    PostgresInsertRowRequest:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: true
          description: Key-value pairs where keys are column names and values are the data to insert

    PostgresUpdateRowsRequest:
      type: object
      required: [update]
      properties:
        filter:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional JSON filter applied to rows
        update:
          type: object
          additionalProperties: true
          description: Fields to update

    PostgresAddColumnRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: >
            New column name. Must be a valid PostgreSQL identifier:
            starts with a letter or underscore, followed by letters, digits, underscores, or dollar signs.
        type:
          type: string
          description: >
            PostgreSQL column type. Common allowed prefixes include:
            INT, INTEGER, BIGINT, SMALLINT, SERIAL, BIGSERIAL, DECIMAL, NUMERIC,
            REAL, DOUBLE PRECISION, BOOLEAN/BOOL, CHAR, VARCHAR, TEXT, DATE,
            TIME, TIMESTAMP, TIMESTAMPTZ, INTERVAL, UUID, JSON, JSONB, BYTEA.
            Parameterized variants like VARCHAR(50) are also accepted.
        default:
          description: Default value for the column (any JSON value)
          nullable: true

    TableColumn:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: >
            Column name. Must be a valid PostgreSQL identifier:
            starts with a letter or underscore, followed by letters, digits, underscores, or dollar signs.
        type:
          type: string
          description: >
            PostgreSQL column type. Common allowed prefixes include:
            INT, INTEGER, BIGINT, SMALLINT, SERIAL, BIGSERIAL, DECIMAL, NUMERIC,
            REAL, DOUBLE PRECISION, BOOLEAN/BOOL, CHAR, VARCHAR, TEXT, DATE,
            TIME, TIMESTAMP, TIMESTAMPTZ, INTERVAL, UUID, JSON, JSONB, BYTEA.
            Parameterized variants like VARCHAR(50) are also accepted.
        default:
          type: string
          nullable: true
          description: Raw SQL default expression (e.g. 'NOW()', '0', 'true').
        primary:
          type: boolean
          default: false
          description: Whether this column is part of the primary key.
        is_unique:
          type: boolean
          default: false
          description: Whether this column has a UNIQUE constraint.
        is_identity:
          type: boolean
          default: false
          description: Whether this column is GENERATED ALWAYS AS IDENTITY.
        nullable:
          type: boolean
          default: true
          description: Whether this column allows NULL values.

    ForeignKeyRef:
      type: object
      required: [local_column, foreign_column]
      properties:
        local_column:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Local column name in the created table.
        foreign_column:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Referenced column name in the target table.
        on_update:
          type: string
          enum: [CASCADE, RESTRICT, "NO ACTION"]
          description: Optional ON UPDATE action. If omitted, database default is used.
        on_delete:
          type: string
          enum: [CASCADE, RESTRICT, "NO ACTION", "SET NULL", "SET DEFAULT"]
          description: Optional ON DELETE action. If omitted, database default is used.

    ForeignKey:
      type: object
      required: [table, references]
      properties:
        schema:
          type: string
          default: public
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Schema name of the referenced table. Defaults to "public" if omitted.
        table:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Target table name for the foreign key.
        references:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ForeignKeyRef'

    CreateTableRequestBody:
      type: object
      required: [table, columns]
      properties:
        schema:
          type: string
          default: public
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: >
            Schema name to create the table in. Must be a valid PostgreSQL identifier.
            Optional; defaults to "public" if omitted.
        table:
          type: string
          minLength: 1
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: >
            Table name. Must be a valid PostgreSQL identifier:
            starts with a letter or underscore, followed by letters, digits, underscores, or dollar signs.
        columns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TableColumn'
          description: At least one column definition is required.
        foreign_keys:
          $ref: '#/components/schemas/ForeignKey'
          nullable: true
          description: Optional foreign key configuration for the table.

    DeleteTableRequestBody:
      type: object
      required: [table]
      properties:
        schema:
          type: string
          default: public
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Schema name of the table to delete. Optional; defaults to "public" if omitted.
        table:
          type: string
          minLength: 1
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Table name to delete.

    MongoCreateCollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Collection name

    MongoInsertDocumentRequest:
      type: object
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: true
          description: Arbitrary document fields to insert

    MongoUpdateDocumentsRequest:
      type: object
      required: [update]
      properties:
        filter:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional JSON filter applied to documents
        update:
          type: object
          additionalProperties: true
          description: Fields to update on matched documents

    MongoAddFieldRequest:
      type: object
      required: [field]
      properties:
        field:
          type: string
          minLength: 1
          description: Field name to add
        field_type:
          type: string
          description: Optional type description or hint for the new field

    MongoQueryRequest:
      type: object
      required: [collection, operation]
      properties:
        collection:
          type: string
          minLength: 1
          description: Target collection name
        operation:
          type: string
          enum: [find, insertOne, updateMany, deleteMany]
          description: MongoDB operation; allowed values are 'find', 'insertOne', 'updateMany', 'deleteMany'
        filter:
          type: object
          additionalProperties: true
        data:
          type: object
          additionalProperties: true
        limit:
          type: integer
          minimum: 1
          description: Optional limit for find operations

paths:
  /health:
    get:
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
            example:
              email: "alice@example.com"
              password: "SecurePass123!"
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid input (e.g. invalid email or password too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and obtain an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            example:
              email: "alice@example.com"
              password: "SecurePass123!"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid input (e.g. invalid email or password format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout and revoke the current refresh token
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token using refresh token cookie
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/google/login:
    get:
      tags: [Auth]
      summary: Initiate Google OAuth login flow
      responses:
        '302':
          description: Redirect to Google OAuth consent screen

  /api/v1/auth/google/callback:
    get:
      tags: [Auth]
      summary: Handle Google OAuth callback
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            example: "4/0AY0e-g7ExampleAuthCode123456789"
        - name: state
          in: query
          required: true
          schema:
            type: string
            example: "csrf-protection-random-state-uuid"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/me:
    get:
      tags: [Users]
      summary: Get current authenticated user's information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Users]
      summary: Update current authenticated user's information
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              email: "alice.new@example.com"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Users]
      summary: Delete current authenticated user's account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    get:
      tags: [Users]
      summary: List all users (Admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Users]
      summary: Get a user by ID (Admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [Users]
      summary: Update a user by ID (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              email: "user+admin@example.com"
              role: "admin"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid request body or user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required or policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Users]
      summary: Delete a user by ID (Admin only)
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User deleted successfully
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required or policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects:
    post:
      tags: [Projects]
      summary: Create a new project and associated database instance
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              name: "Analytics Service DB"
              description: "Primary PostgreSQL database for the analytics microservice"
              db_type: "sql"
              resource_tier: "basic"
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Projects]
      summary: List projects for the authenticated user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Projects]
      summary: Get a project by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Projects]
      summary: Delete a project by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}/postgres/tables:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Postgres]
      summary: List PostgreSQL tables for a project
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Tables retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Invalid project ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Postgres]
      summary: Create a new PostgreSQL table
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequestBody'
            example:
              table: "customers"
              columns:
                - name: "id"

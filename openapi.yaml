    get:
      operationId: listPostgresIndexes
      tags: [Postgres]
      summary: List indexes on a PostgreSQL table
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Indexes listed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostgresIndexesListData'
              example:
                status: success
                message: Indexes listed successfully
                data:
                  indexes:
                    - name: customers_pkey
                      unique: true
                      primary: true
                      method: btree
                      definition: CREATE UNIQUE INDEX customers_pkey ON public.customers USING btree (id)
                      valid: true
                    - name: idx_customers_email
                      unique: true
                      primary: false
                      method: btree
                      definition: CREATE UNIQUE INDEX idx_customers_email ON public.customers USING btree (email)
                      valid: true
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not accessible or database instance not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createPostgresIndex
      tags: [Postgres]
      summary: Create an index on a PostgreSQL table
      description: Creates a simple column index (no partial or expression indexes). Primary key indexes are created via table DDL, not this endpoint.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostgresCreateIndexRequest'
            example:
              name: idx_customers_email
              columns: [email]
              unique: true
              method: btree
      responses:
        '201':
          description: |
            Index created successfully. Response has `status` and `message` only; `data` is omitted (no body payload).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseSuccessMessageOnly'
              example:
                status: success
                message: Index created successfully
        '400':
          description: Invalid body, identifiers, or unsupported method
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not accessible or database instance not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: An index with this name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


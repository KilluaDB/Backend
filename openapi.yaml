  /api/v1/projects/{id}/postgres/schema/from-text:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: generateSchemaFromText
      tags: [Postgres]
      summary: Generate a PostgreSQL database schema from requirement text (non-streaming)
      description: |
        Sends a request to the upstream SchemaAgent (AI) service to generate a complete PostgreSQL schema.
        Returns the parsed Mermaid ER diagram, raw DDL statement blocks, index definitions, and evaluation report.
        The generated DDL is securely cached in Redis for 1 hour under the project ID for subsequent approval.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requirement_text]
              properties:
                requirement_text:
                  type: string
                  description: Natural language description of the database requirements
                model_name:
                  type: string
                  description: "Model name used by the AI service (default: deepseek)"
                  default: deepseek
                database_name:
                  type: string
                  description: Optional database name hint for the generator
            example:
              requirement_text: "A university needs a course selection system"
              model_name: "deepseek"
              database_name: "uni_db"
      responses:
        '200':
          description: Schema generated successfully and cached in Redis
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          mmd:
                            type: string
                            description: Generated Mermaid ER diagram content
                          mmd_valid:
                            type: boolean
                            description: Whether the Mermaid syntax is valid
                          db_schema:
                            type: string
                            description: Target database engine type (e.g. postgres)
                          full_report:
                            type: string
                            description: Design evaluation feedback report from AI agents
                          ddl:
                            type: string
                            description: Complete CREATE TABLE DDL SQL statements block
                          index_statements:
                            type: array
                            items:
                              type: string
                            description: Suggested index creation SQL queries
                          generation_time:
                            type: number
                            description: Duration in seconds to process generation
              example:
                status: success
                message: Schema generated successfully
                data:
                  mmd: "erDiagram\n  STUDENT ||--o{ ENROLLMENT : takes"
                  mmd_valid: true
                  db_schema: "postgres"
                  full_report: "Designed 3 tables..."
                  ddl: "CREATE TABLE Student (\n  id SERIAL PRIMARY KEY\n);"
                  index_statements: []
                  generation_time: 12.4
        '400':
          description: Invalid request parameters or request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream schema generator unavailable or returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}/postgres/schema/approve:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: approveSchemaDDL
      tags: [Postgres]
      summary: Approve and apply the generated schema suggestion on the database
      description: |
        Retrieves the un-tampered DDL SQL block securely cached in Redis for this project.
        Executes the SQL queries atomically inside a single transaction pool, and clears the Redis cache.
        No payload body parameter is accepted to avoid any potential SQL injection manipulation from users.
      security:
        - BearerAuth: []
      responses:
        '201':
          description: Schema DDL successfully approved and applied to the database instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseSuccessMessageOnly'
              example:
                status: success
                message: Schema suggestion applied and executed successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No pending schema suggestion found in Redis, or it has expired after 1 hour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: SQL execution failed or failed to connect to database pool
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}/postgres/schema/from-text/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: generateSchemaFromTextStream
      tags: [Postgres]
      summary: Generate a Mermaid ER diagram from requirement t (streaming)
      description: |
        Proxies the local SchemaAgent (AI) service and streams progress events as Server-Sent Events (SSE).
        The Mermaid ER diagram is provided in a streamed event with `type: "mermaid"`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requirement_text]
              properties:
                requirement_text:
                  type: string
                  description: Natural language description of the database requirements
                model_name:
                  type: string
                  description: "Model name used by the AI service (default: deepseek)"
                  default: deepseek
                database_name:
                  type: string
                  description: Optional database name hint for the generator
            example:
              requirement_text: "A university needs a course selection system"
              model_name: "deepseek"
              database_name: "uni_db"
      responses:
        '200':
          description: SSE stream of schema generation events
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {"type":"phase","phase":"logical_design","status":"start"}

                data: {"type":"mermaid","content":"erDiagram\n  Student ||--o{ Enrollment : takes","valid":true}

                data: {"type":"done","message":"Schema generation complete"}

                data: [DONE]
        '400':
          description: Invalid request body or project ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream schema generator unavailable or returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


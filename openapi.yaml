      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          result:
                            $ref: '#/components/schemas/SQLQueryResult'
                          execution_id:
                            type: string
                            format: uuid
                          execution_time_ms:
                            type: integer
              example:
                status: success
                message: Query executed successfully
                data:
                  execution_id: 8b3f0c1e-2a4d-4e1f-9c0b-111122223333
                  execution_time_ms: 3
                  result:
                    columns:
                      - id
                      - email
                      - status
                    rows:
                      - id: a1b2c3d4-e5f6-7890-abcd-1234567890ab
                        email: bob@example.com
                        status: active
                    row_count: 1
                    execution_time_ms: 3
                    error: null
        '400':
          description: Invalid input (missing query, invalid project ID, or disallowed SQL such as SELECT without LIMIT or LIMIT above the allowed maximum)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

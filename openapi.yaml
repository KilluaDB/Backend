            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not accessible or database instance not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}/postgres/schema/from-text/stream:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: generateSchemaFromTextStream
      tags: [Postgres]
      summary: Generate a Mermaid ER diagram from requirement text (streaming)
      description: |
        Proxies the local SchemaAgent (AI) service and streams progress events as Server-Sent Events (SSE).
        The Mermaid ER diagram is provided in a streamed event with `type: "mermaid"`.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requirement_text]
              properties:
                requirement_text:
                  type: string
                  description: Natural language description of the database requirements
                model_name:
                  type: string
                  description: "Model name used by the AI service (default: deepseek)"
                  default: deepseek
                database_name:
                  type: string
                  description: Optional database name hint for the generator
            example:
              requirement_text: "A university needs a course selection system"
              model_name: "deepseek"
              database_name: "uni_db"
      responses:
        '200':
          description: SSE stream of schema generation events
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {"type":"phase","phase":"logical_design","status":"start"}

                data: {"type":"mermaid","content":"erDiagram\n  Student ||--o{ Enrollment : takes","valid":true}

                data: {"type":"done","message":"Schema generation complete"}

                data: [DONE]
        '400':
          description: Invalid request body or project ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Upstream schema generator unavailable or returned an error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────────────────────
  # Postgres — Query
  # ────────────────────────────────────────────────────────────

  /api/v1/projects/{id}/postgres/query/execute:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: executePostgresQuery
      tags: [Postgres]
      summary: Execute a SQL query against a PostgreSQL project database
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteSQLQueryRequest'
            example:
              query: "SELECT id, email, status FROM public.customers WHERE status = 'active' ORDER BY created_at DESC LIMIT 50;"
      responses:
        '200':
          description: Query executed successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          result:
                            $ref: '#/components/schemas/SQLQueryResult'
                          execution_id:
                            type: string
                            format: uuid
                          execution_time_ms:
                            type: integer
              example:
                status: success
                message: Query executed successfully
                data:
                  execution_id: 8b3f0c1e-2a4d-4e1f-9c0b-111122223333
                  execution_time_ms: 3
                  result:
                    columns:
                      - id
                      - email
                      - status
                    rows:
                      - id: a1b2c3d4-e5f6-7890-abcd-1234567890ab
                        email: bob@example.com
                        status: active
                    row_count: 1
                    execution_time_ms: 3
                    error: null
        '400':
          description: Invalid input (missing query, invalid project ID, or disallowed SQL such as SELECT without LIMIT or LIMIT above the allowed maximum)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not accessible or database instance not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}/postgres/query/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPostgresQueryHistory
      tags: [Postgres]
      summary: Get PostgreSQL query statistics for this project
      description: Returns recent user-generated statements from pg_stat_statements for this project's database instance, filtering out obvious system and catalog queries.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 30
          description: Max number of history items to return (default 10, max 30)
          example: 10
      responses:
        '200':
          description: Query history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/QueryHistoryItem'
              example:
                status: success
                message: Query history retrieved successfully
                data:
                  - query: SELECT id, email FROM public.customers LIMIT 10;
                    calls: 4
                    total_time_ms: 18.42
                    mean_time_ms: 4.6
                    rows: 40
                    shared_blks_hit: 28
                    shared_blks_read: 2
                    temp_blks_written: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not accessible or database instance not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to get query history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


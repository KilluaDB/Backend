openapi: 3.0.3
info:
  title: KilluaDB Backend API
  version: 1.4.0
  description: |
    REST API for a database-as-a-service backend.
    PostgreSQL and MongoDB are namespaced under `/api/v1/projects/{id}/postgres/*`
    and `/api/v1/projects/{id}/mongodb/*`.

    Latest changes (v1.4.0):
    - Removed `type: object` restriction from `APIResponse.data` so that it supports array responses natively and properly passes strict OpenAPI validation.
    - Updated `MongoGetDocuments` to accept query parameters instead of a JSON request body, aligning with REST best practices and OpenAPI 3.0 semantics (which forbid bodies in GET requests). Updated backend handler to use `ShouldBindQuery`.
    - Added all missing MongoDB endpoints for documents and dashboard metrics.
    - Added `postgrest_url`, `api_key`, and `jwt_secret` to the project access endpoint.
    - Verified all remaining Go structs precisely map to their JSON representations.
    - Aligned all endpoint schemas with actual Go handler request/response shapes.
    - Auth register/login/refresh responses accurately reflect `user_id` + `access_token`
      data and the `refresh_token` httpOnly cookie.
    - Google OAuth login correctly returns HTTP 307 (Temporary Redirect).
    - Google OAuth callback returns `access_token` only (no `user_id`).
    - User endpoints now reference the `User` schema for `data` payloads.
    - Project responses now include the `status` field (from database instance).
    - Removed phantom `/dashboard/roles` endpoints (no handler exists).
    - PostgreSQL APIs accept an optional `schema` (query or JSON). When omitted or empty,
      the server uses `public` (PostgreSQL default namespace).
    - Table delete is `DELETE /projects/{id}/postgres/tables/{table}` with a JSON body
      including `table` and optional `schema` (defaults to `public`).
    - `GET /projects/{id}/postgres/schemas` lists non-system schema names.
    - `GET /projects/{id}/postgres/tables/{table}` returns column and key metadata (no row data).
    - `GET .../tables/{table}/rows` supports optional `include_total=true` to add a matching row count.
    - Query history at `GET .../postgres/query/history` is sourced from `pg_stat_statements`
      and filters obvious system/catalog statements.
    - Query execute and query history responses use standard APIResponse (`data` holds payload).
    - Index management: `GET/POST .../tables/{table}/indexes` and `DELETE .../tables/{table}/indexes/{index}`
      (quoted identifiers only; primary key indexes cannot be dropped via this API).

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Projects
  - name: Postgres
  - name: MongoDB

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    APIResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
        data:
          nullable: true
        error:
          type: string
          nullable: true

    ErrorResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
        error:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
          description: PostgreSQL SQLSTATE code, present only for Postgres errors

    PostgresGetRowsData:
      type: object
      required: [rows, limit, offset, has_more]
      description: |
        Paginated table rows. Row order is not stable across requests unless you rely on PostgreSQL's
        implicit order for the same query (for deterministic paging, execute a query with ORDER BY via
        the SQL API instead).
      properties:
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          description: Page size used for this request
        offset:
          type: integer
          minimum: 0
          description: Number of rows skipped
        has_more:
          type: boolean
          description: True if more rows exist after this page
        total:
          type: integer
          format: int64
          nullable: true
          description: Present when `include_total=true`; count of rows matching the filter (may be expensive on large tables)

    PostgresSchemasListData:
      type: object
      required: [schemas]
      properties:
        schemas:
          type: array
          items:
            type: string
          description: User-visible schema names (excludes PostgreSQL system schemas)

    PostgresColumnDetail:
      type: object
      properties:
        name:
          type: string
        data_type:
          type: string
        udt_name:
          type: string
        char_max_length:
          type: integer
          nullable: true
        is_nullable:
          type: boolean
        column_default:
          type: string
          nullable: true
        is_identity:
          type: boolean

    PostgresForeignKeyMeta:
      type: object
      properties:
        constraint_name:
          type: string
        from_column:
          type: string
        to_schema:
          type: string
        to_table:
          type: string
        to_column:
          type: string
        update_rule:
          type: string
        delete_rule:
          type: string

    PostgresTableMetadata:
      type: object
      required: [schema, table, columns, primary_keys, foreign_keys]
      properties:
        schema:
          type: string
        table:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/PostgresColumnDetail'
        primary_keys:
          type: array
          items:
            type: string
        foreign_keys:
          type: array
          items:
            $ref: '#/components/schemas/PostgresForeignKeyMeta'

    PostgresTableIndexInfo:
      type: object
      required: [name, table, columns, unique, primary, method, definition, valid]
      properties:
        name:
          type: string
        table:
          type: string
        columns:
          type: array
          items:
            type: string
        unique:
          type: boolean
        primary:
          type: boolean
        method:
          type: string
          description: Access method (e.g. btree, gin)
        definition:
          type: string
          description: SQL from pg_get_indexdef
        valid:
          type: boolean
          description: false if the index is invalid (e.g. after a failed concurrent build)

    PostgresIndexesListData:
      type: object
      required: [indexes]
      properties:
        indexes:
          type: array
          items:
            $ref: '#/components/schemas/PostgresTableIndexInfo'

    PostgresCreateIndexRequest:
      type: object
      required: [name, columns]
      properties:
        name:
          type: string
          description: Index name (valid PostgreSQL identifier)
        columns:
          type: array
          items:
            type: string
          minItems: 1
          description: Column names in index key order
        unique:
          type: boolean
          default: false
        method:
          type: string
          description: Access method; omit or `btree` for default B-tree
          enum: [btree, hash, gin, gist, spgist, brin]

    PostgresCreateIndexData:
      type: object
      required: [name, table, columns, unique, method]
      properties:
        name:
          type: string
        table:
          type: string
        columns:
          type: array
          items:
            type: string
        unique:
          type: boolean
        method:
          type: string

    # --- PostgreSQL handler payloads (data field shapes) ---
    PostgresListTablesData:
      type: array
      description: Base table names in the requested schema (order not guaranteed)
      items:
        type: string

    PostgresSchemaVisualizeData:
      type: object
      required: [mermaid, schema]
      properties:
        mermaid:
          type: string
          description: Mermaid ER diagram source generated for the schema
        schema:
          type: string
          description: PostgreSQL schema name that was visualized

    PostgresTableOpResult:
      type: object
      required: [rows_affected]
      properties:
        rows_affected:
          type: integer
          format: int64
          description: Rows reported by the last DDL statement (often 0 for some operations)

    PostgresTableOpData:
      type: object
      required: [result]
      description: Wrapper returned by create, update, and delete table endpoints
      properties:
        result:
          $ref: '#/components/schemas/PostgresTableOpResult'

    PostgresInsertRowData:
      type: object
      required: [row_id]
      properties:
        row_id:
          description: Inserted row primary key (integer identity/serial or UUID string)
          oneOf:
            - type: integer
              format: int64
            - type: string
              format: uuid

    PostgresAddColumnData:
      type: object
      required: [column_id]
      properties:
        column_id:
          type: integer
          format: int64
          description: PostgreSQL system attribute number (`pg_attribute.attnum`) for the new column

    APIResponseSuccessMessageOnly:
      type: object
      required: [status, message]
      description: Success response with no `data` field (omitted in JSON)
      properties:
        status:
          type: string
          enum: [success]
        message:
          type: string

    AuthRegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    AuthTokenResponse:
      type: object
      required: [user_id, access_token]
      properties:
        user_id:
          type: string
          format: uuid
          description: ID of the authenticated user
        access_token:
          type: string
          description: JWT access token

    GoogleAuthCallbackResponse:
      type: object
      required: [access_token]
      properties:
        access_token:
          type: string
          description: JWT access token

    Project:
      type: object
      required: [id, user_id, name, db_type, resource_tier, created_at]
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        db_type:
          type: string
          enum: [sql, nosql]
          description: "'sql' uses PostgreSQL; 'nosql' uses MongoDB"
        resource_tier:
          type: string
          enum: [free, basic, premium]
        created_at:
          type: string
          format: date-time
        status:
          type: string
          enum: [creating, running, failed, paused, deleted]
          description: Database instance status. Present when the project has an associated database instance.
        runtime_created_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the database runtime was first created (from the Kubernetes operator)
        runtime_updated_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when the database runtime was last updated (from the Kubernetes operator)

    CreateProjectRequest:
      type: object
      required: [name, db_type, password]
      properties:
        name:
          type: string
          minLength: 1
          description: Project display name
        description:
          type: string
          nullable: true
          description: Optional; defaults to empty string if omitted
        db_type:
          type: string
          enum: [sql, nosql]
          description: "'sql' uses PostgreSQL; 'nosql' uses MongoDB"
        resource_tier:
          type: string
          enum: [free, basic, premium]
          default: free
          description: Optional; defaults to 'free' if omitted. Allowed values are 'free', 'basic', or 'premium'
        password:
          type: string
          minLength: 12
          description: |
            Database password. Required field. Must be at least 12 characters and contain:
            - At least one uppercase letter (A-Z)
            - At least one lowercase letter (a-z)
            - At least one digit (0-9)
            - At least one special character (!@#$%^&*-_+=)
          
            Applies to both PostgreSQL and MongoDB instances.

    CreateProjectResponse:
      type: object
      required: [project]
      description: Response data for project creation — wraps the project object
      properties:
        project:
          $ref: '#/components/schemas/Project'

    ExecuteSQLQueryRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string

    SQLQueryResult:
      type: object
      required: [columns, rows, row_count, execution_time_ms]
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        row_count:
          type: integer
        rows_affected:
          type: integer
        execution_time_ms:
          type: integer
        error:
          type: string
          nullable: true

    TextToSQLRequest:
      type: object
      required: [question]
      properties:
        question:
          type: string
          description: Natural language question describing desired data, filters, or aggregations

    TextToSQLResponse:
      type: object
      properties:
        sql:
          type: string
          description: Generated SQL statement
        result:
          $ref: '#/components/schemas/SQLQueryResult'
        execution_id:
          type: string
          format: uuid
        execution_time_ms:
          type: integer

    QueryHistoryItem:
      type: object
      required: [query, calls, total_time_ms, mean_time_ms, rows, shared_blks_hit, shared_blks_read, temp_blks_written]
      properties:
        query:
          type: string
        calls:
          type: integer
        total_time_ms:
          type: number
        mean_time_ms:
          type: number
        rows:
          type: integer
        shared_blks_hit:
          type: integer
        shared_blks_read:
          type: integer
        temp_blks_written:
          type: integer

    PostgresDashboardOverview:
      type: object
      properties:
        instance:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
            host:
              type: string
              nullable: true
            port:
              type: integer
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
        db:
          type: object
          nullable: true
          properties:
            database:
              type: string
            server_version:
              type: string
            postmaster_uptime_s:
              type: integer
              format: int64
            ping_time_ms:
              type: integer
              format: int64
            now_rfc3339:
              type: string
            is_in_recovery:
              type: boolean
            has_pg_stat_statements:
              type: boolean
        schema_summary:
          type: object
          nullable: true
          properties:
            total_tables:
              type: integer
              format: int64
            total_columns:
              type: integer
              format: int64
            total_primary_keys:
              type: integer
              format: int64

    PostgresDashboardMetrics:
      type: object
      properties:
        database:
          type: string
        db_size_bytes:
          type: integer
          format: int64
        active_connections:
          type: integer
          format: int64
        idle_connections:
          type: integer
          format: int64
        cache_hit_ratio:
          type: number
          format: double
        deadlocks:
          type: integer
          format: int64
        blocked_sessions:
          type: integer
          format: int64
        tables_needing_vacuum:
          type: integer
          format: int64

    User:
      type: object
      required: [id, email, role, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, deleted]
        created_at:
          type: string
          format: date-time
        last_login_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          description: New email for the user
        role:
          type: string
          enum: [user, admin]
          description: New role; only admins may change roles

    PostgresInsertRowRequest:
      type: object
      required: [values]
      properties:
        values:
          type: object
          additionalProperties: true
          description: Key-value pairs where keys are column names and values are the data to insert

    PostgresUpdateRowsRequest:
      type: object
      required: [update]
      properties:
        filter:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional JSON filter applied to rows
        update:
          type: object
          additionalProperties: true
          description: Fields to update

    PostgresAddColumnRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: >
            New column name. Must be a valid PostgreSQL identifier:
            starts with a letter or underscore, followed by letters, digits, underscores, or dollar signs.
        type:
          type: string
          description: >
            PostgreSQL column type. Common allowed prefixes include:
            INT, INTEGER, BIGINT, SMALLINT, SERIAL, BIGSERIAL, DECIMAL, NUMERIC,
            REAL, DOUBLE PRECISION, BOOLEAN/BOOL, CHAR, VARCHAR, TEXT, DATE,
            TIME, TIMESTAMP, TIMESTAMPTZ, INTERVAL, UUID, JSON, JSONB, BYTEA.
            Parameterized variants like VARCHAR(50) are also accepted.
        default:
          description: Default value for the column (any JSON value)
          nullable: true
        primary:
          type: boolean
          default: false
          description: Whether this column is a primary key (allowed only if no primary key exists yet).
        is_unique:
          type: boolean
          default: false
          description: Whether this column has a UNIQUE constraint.
        is_identity:
          type: boolean
          default: false
          description: Whether this column is GENERATED ALWAYS AS IDENTITY.
        nullable:
          type: boolean
          default: true
          description: Whether this column allows NULL values.
        foreign_keys:
          type: array
          items:
            $ref: '#/components/schemas/PostgresAddColumnForeignKey'

    PostgresAddColumnForeignKey:
      type: object
      required: [table, foreign_column]
      properties:
        schema:
          type: string
          default: public
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Schema name of the referenced table. Defaults to `public` if omitted.
        table:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Target table name for the foreign key relation.
        foreign_column:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Referenced column name in the target table.
        on_update:
          type: string
          description: Optional ON UPDATE action.
        on_delete:
          type: string
          description: Optional ON DELETE action.

    TableColumn:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: >
            Column name. Must be a valid PostgreSQL identifier:
            starts with a letter or underscore, followed by letters, digits, underscores, or dollar signs.
        type:
          type: string
          description: >
            PostgreSQL column type. Common allowed prefixes include:
            INT, INTEGER, BIGINT, SMALLINT, SERIAL, BIGSERIAL, DECIMAL, NUMERIC,
            REAL, DOUBLE PRECISION, BOOLEAN/BOOL, CHAR, VARCHAR, TEXT, DATE,
            TIME, TIMESTAMP, TIMESTAMPTZ, INTERVAL, UUID, JSON, JSONB, BYTEA.
            Parameterized variants like VARCHAR(50) are also accepted.
        default:
          type: string
          nullable: true
          description: Raw SQL default expression (e.g. 'NOW()', '0', 'true').
        primary:
          type: boolean
          default: false
          description: Whether this column is part of the primary key.
        is_unique:
          type: boolean
          default: false
          description: Whether this column has a UNIQUE constraint.
        is_identity:
          type: boolean
          default: false
          description: Whether this column is GENERATED ALWAYS AS IDENTITY. Allowed only when type is smallint, integer, or bigint.
        nullable:
          type: boolean
          default: true
          description: Whether this column allows NULL values.

    ForeignKeyRef:
      type: object
      required: [local_column, foreign_column]
      properties:
        local_column:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Local column name in the created table.
        foreign_column:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Referenced column name in the target table.
        on_update:
          type: string
          enum: [CASCADE, RESTRICT, "NO ACTION"]
          description: Optional ON UPDATE action. If omitted, database default is used.
        on_delete:
          type: string
          enum: [CASCADE, RESTRICT, "NO ACTION", "SET NULL", "SET DEFAULT"]
          description: Optional ON DELETE action. If omitted, database default is used.

    ForeignKey:
      type: object
      required: [table, references]
      properties:
        schema:
          type: string
          default: public
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Schema name of the referenced table. Defaults to `public` if omitted.
        table:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Target table name for the foreign key.
        references:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ForeignKeyRef'

    CreateTableRequestBody:
      type: object
      required: [table, columns]
      properties:
        schema:
          type: string
          default: public
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: >
            Schema name to create the table in. Must be a valid PostgreSQL identifier.
            Defaults to `public` if omitted.
        table:
          type: string
          minLength: 1
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: >
            Table name. Must be a valid PostgreSQL identifier:
            starts with a letter or underscore, followed by letters, digits, underscores, or dollar signs.
        columns:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TableColumn'
          description: At least one column definition is required.
        foreign_keys:
          type: object
          nullable: true
          description: Optional foreign key configuration for the table.
          allOf:
            - $ref: '#/components/schemas/ForeignKey'

    DeleteTableRequestBody:
      type: object
      required: [table]
      properties:
        schema:
          type: string
          default: public
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Schema name of the table to delete. Defaults to `public` if omitted.
        table:
          type: string
          minLength: 1
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: Table name to delete.

    UpdateTableRequestBody:
      type: object
      description: >
        All properties are optional for JSON purposes; the server returns 400 if the effective request
        would make no changes. Omit `columns` entirely (or null) to leave columns unchanged.
        Do not send an empty `columns` array.
      properties:
        schema:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: >
            New schema for the table after column/FK updates. Omit or leave empty to keep the current schema.
        table:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: New table name after updates. Omit or leave empty to keep the current name.
        columns:
          type: array
          nullable: true
          minItems: 1
          items:
            $ref: '#/components/schemas/TableColumn'
          description: >
            When present, desired full column set (non-empty). Columns are added, altered (type, nullability,
            default), or dropped. Changing primary key, identity, or unique flags on existing columns is not supported.
        foreign_keys:
          type: object
          nullable: true
          description: >
            When present, desired single-column foreign keys for this table. Use `references: []` to remove
            all such keys. When adding keys, set `table` (referenced table) and each reference. Composite
            foreign keys on the table are not altered by this endpoint.
          properties:
            schema:
              type: string
              default: public
              pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
              description: Schema of the referenced table; defaults to `public` if omitted.
            table:
              type: string
              pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
              description: Referenced table name (required when adding foreign keys).
            references:
              type: array
              items:
                $ref: '#/components/schemas/ForeignKeyRef'

    MongoCreateCollectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Collection name

    MongoAddFieldRequest:
      type: object
      required: [field]
      properties:
        field:
          type: string
          minLength: 1
          description: Field name to add to all documents in the collection
        default:
          description: Default value to set for the new field on existing documents (any JSON value)
          nullable: true
        update_existing:
          type: boolean
          description: When true, updates existing documents that already have this field
          nullable: true

    MongoInsertDocumentsRequest:
      type: object
      required: [documents]
      properties:
        documents:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
          description: Array of documents to insert

    MongoInsertDocumentsResult:
      type: object
      required: [inserted_count, inserted_ids]
      properties:
        inserted_count:
          type: integer
          format: int64
        inserted_ids:
          type: array
          items: {}
          description: Array of inserted document IDs

    MongoUpdateDocumentsRequest:
      type: object
      required: [filter, update]
      properties:
        filter:
          type: object
          additionalProperties: true
          description: MongoDB filter to match documents
        update:
          type: object
          additionalProperties: true
          description: Fields to update on matched documents
        upsert:
          type: boolean
          nullable: true
          description: When true, inserts a document if no match is found
        update_one:
          type: boolean
          nullable: true
          description: When true, only the first matching document is updated

    MongoUpdateDocumentsResult:
      type: object
      required: [matched, modified]
      properties:
        matched:
          type: integer
          format: int64
        modified:
          type: integer
          format: int64
        upserted_id:
          description: ID of the upserted document (present only when upsert occurs)
          nullable: true

    MongoDeleteDocumentsRequest:
      type: object
      required: [filter]
      properties:
        filter:
          type: object
          additionalProperties: true
          description: MongoDB filter to match documents for deletion
        delete_one:
          type: boolean
          nullable: true
          description: When true, only the first matching document is deleted

    MongoDeleteDocumentsResult:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: integer
          format: int64

    MongoQueryDocumentsRequest:
      type: object
      properties:
        filter:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional MongoDB filter expression
        sort:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional sort specification (e.g. {"created_at":-1})
        page:
          type: integer
          format: int64
          description: Page number (1-based); defaults to 1
        limit:
          type: integer
          format: int64
          description: Maximum documents per page; defaults to server-defined limit

    MongoQueryDocumentsResult:
      type: object
      required: [documents, total, page, limit]
      properties:
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64

    MongoCountDocumentsRequest:
      type: object
      properties:
        filter:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional MongoDB filter; if omitted counts all documents

    MongoCountDocumentsResult:
      type: object
      required: [count]
      properties:
        count:
          type: integer
          format: int64

    MongoGetDocumentsRequest:
      type: object
      properties:
        limit:
          type: integer
          format: int64
          default: 20
          description: Maximum documents to return per page
        page:
          type: integer
          format: int64
          default: 1
          description: Page number (1-based)

    MongoGetDocumentsResult:
      type: object
      required: [documents, total, page, limit]
      properties:
        documents:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
        limit:
          type: integer
          format: int64

    MongoUpdateFieldRequest:
      type: object
      properties:
        value:
          description: New value for the field (any JSON value)
        type:
          type: string
          description: 'Optional type hint ("string", "int", "double", "boolean", "date", "null")'

    MongoAddDocumentFieldRequest:
      type: object
      required: [field, type]
      properties:
        field:
          type: string
          description: Name of the field to add
        value:
          description: Value for the field (any JSON value)
        type:
          type: string
          description: 'Type hint ("string", "int", "double", "boolean", "date", "null")'

    MongoDashboardMetrics:
      type: object
      required: [database, db_size_bytes, collections, total_documents, last_30_days]
      properties:
        database:
          type: string
        db_size_bytes:
          type: integer
          format: int64
        collections:
          type: integer
          format: int64
        total_documents:
          type: integer
          format: int64
        last_30_days:
          type: object
          required: [inserts, updates, deletes]
          properties:
            inserts:
              type: integer
              format: int64
            updates:
              type: integer
              format: int64
            deletes:
              type: integer
              format: int64

paths:
  /health:
    get:
      operationId: healthCheck
      summary: Health check
      tags: [Health]
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  # ────────────────────────────────────────────────────────────
  # Auth
  # ────────────────────────────────────────────────────────────

  /api/v1/auth/register:
    post:
      operationId: authRegister
      tags: [Auth]
      summary: Register a new user
      description: |
        Creates a new user account and returns an access token. A `refresh_token` httpOnly
        cookie is also set (30-day expiry, Secure, HttpOnly).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRegisterRequest'
            example:
              email: "alice@example.com"
              password: "SecurePass123!"
      responses:
        '201':
          description: User registered successfully
          headers:
            Set-Cookie:
              description: httpOnly refresh_token cookie
              schema:
                type: string
                example: "refresh_token=eyJ...; Path=/; Max-Age=2592000; HttpOnly; Secure"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenResponse'
              example:
                status: success
                message: New user registered successfully!
                data:
                  user_id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                  access_token: "eyJhbGciOiJIUzI1NiIs..."
        '400':
          description: Invalid input (e.g. invalid email or password too short)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Please provide your email and password correctly
        '409':
          description: An account with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: An account with this email already exists

  /api/v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Login and obtain an access token
      description: |
        Authenticates the user and returns an access token. A `refresh_token` httpOnly
        cookie is also set (30-day expiry, Secure, HttpOnly).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            example:
              email: "alice@example.com"
              password: "SecurePass123!"
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: httpOnly refresh_token cookie
              schema:
                type: string
                example: "refresh_token=eyJ...; Path=/; Max-Age=2592000; HttpOnly; Secure"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenResponse'
              example:
                status: success
                message: User logged in successfully
                data:
                  user_id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                  access_token: "eyJhbGciOiJIUzI1NiIs..."
        '400':
          description: Invalid input (e.g. invalid email or password format)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Invalid email or password format
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Invalid email or password

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Logout and revoke the current refresh token
      description: |
        Reads the `refresh_token` from the httpOnly cookie, revokes it, and clears the cookie.
        If no cookie is present the request still succeeds (idempotent).
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          headers:
            Set-Cookie:
              description: Clears the refresh_token cookie
              schema:
                type: string
                example: "refresh_token=; Path=/; Max-Age=-1; HttpOnly; Secure"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseSuccessMessageOnly'
              example:
                status: success
                message: Logged out successfully
        '401':
          description: Unauthorized (invalid or missing access token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Could not revoke session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Refresh access token using refresh token cookie
      description: |
        Reads the `refresh_token` from the httpOnly cookie, validates it, rotates to a new
        refresh token (stored in a new cookie), and returns a new access token plus user_id.
      responses:
        '200':
          description: New access token issued
          headers:
            Set-Cookie:
              description: New rotated refresh_token cookie
              schema:
                type: string
                example: "refresh_token=eyJ...; Path=/; Max-Age=2592000; HttpOnly; Secure"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenResponse'
              example:
                status: success
                message: Access token refreshed successfully
                data:
                  user_id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                  access_token: "eyJhbGciOiJIUzI1NiIs..."
        '400':
          description: Missing refresh token cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Missing refresh token
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Invalid or expired refresh token

  /api/v1/auth/google/login:
    get:
      operationId: googleAuthLogin
      tags: [Auth]
      summary: Initiate Google OAuth login flow
      description: |
        Generates an OAuth state value, stores it in an `oauth_state` cookie, and redirects the
        client to Google's OAuth consent screen. The redirect uses HTTP 307 (Temporary Redirect).
      responses:
        '307':
          description: Redirect to Google OAuth consent screen
          headers:
            Location:
              description: Google OAuth authorization URL with state
              schema:
                type: string
            Set-Cookie:
              description: oauth_state cookie (1 hour TTL, HttpOnly)
              schema:
                type: string

  /api/v1/auth/google/callback:
    get:
      operationId: googleAuthCallback
      tags: [Auth]
      summary: Handle Google OAuth callback
      description: |
        Validates the `state` parameter against the `oauth_state` cookie to prevent CSRF,
        exchanges the authorization code for a token, and returns an access token.
        Unlike regular login, only `access_token` is returned (no `user_id` in the response body).
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            example: "4/0AY0e-g7ExampleAuthCode123456789"
        - name: state
          in: query
          required: true
          schema:
            type: string
            example: "csrf-protection-random-state-uuid"
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/GoogleAuthCallbackResponse'
              example:
                status: success
                message: User Login Successfully!
                data:
                  access_token: "eyJhbGciOiJIUzI1NiIs..."
        '400':
          description: Missing or invalid parameters (code, state, or state cookie)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: State mismatch — possible CSRF attack
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: State mismatch - possible CSRF attack
        '500':
          description: Token exchange or login processing failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────────────────────
  # Users
  # ────────────────────────────────────────────────────────────

  /api/v1/users/me:
    get:
      operationId: getMe
      tags: [Users]
      summary: Get current authenticated user's information
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
              example:
                status: success
                message: User retrieved successfully
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                  email: "alice@example.com"
                  role: "user"
                  status: "active"
                  created_at: "2026-01-15T10:30:00Z"
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateMe
      tags: [Users]
      summary: Update current authenticated user's information
      description: |
        Updates the authenticated user's own profile. Only `email` can be changed by non-admin users.
        Attempting to change `role` as a non-admin returns 403.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              email: "alice.new@example.com"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
              example:
                status: success
                message: User updated successfully
                data:
                  id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                  email: "alice.new@example.com"
                  role: "user"
                  status: "active"
                  created_at: "2026-01-15T10:30:00Z"
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — only admins can change user roles / admin cannot demote themselves
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMe
      tags: [Users]
      summary: Delete current authenticated user's account
      description: |
        Soft-deletes the authenticated user. Returns `access_token: ""` to signal the client
        should clear its stored token.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User deleted successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          access_token:
                            type: string
                            description: Empty string indicating the token should be cleared
              example:
                status: success
                message: User deleted successfully
                data:
                  access_token: ""
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden — cannot delete the last admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List all users (Admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of users retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
              example:
                status: success
                message: Users retrieved successfully
                data:
                  - id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                    email: "alice@example.com"
                    role: "admin"
                    status: "active"
                    created_at: "2026-01-15T10:30:00Z"
                  - id: "b2c3d4e5-f607-8901-bcde-234567890abc"
                    email: "bob@example.com"
                    role: "user"
                    status: "active"
                    created_at: "2026-02-20T14:00:00Z"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getUserById
      tags: [Users]
      summary: Get a user by ID (Admin only)
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      operationId: updateUserById
      tags: [Users]
      summary: Update a user by ID (Admin only)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              email: "user+admin@example.com"
              role: "admin"
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: Invalid request body or user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required or policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteUserById
      tags: [Users]
      summary: Delete a user by ID (Admin only)
      description: |
        Handler calls `responses.Success(c, http.StatusNoContent, nil, ...)` which returns
        a 204 with a JSON body containing `status` and `message` (no `data` field).
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseSuccessMessageOnly'
        '400':
          description: Invalid user ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden - Admin access required or policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────────────────────────────────────
  # Projects
  # ────────────────────────────────────────────────────────────

  /api/v1/projects:
    post:
      operationId: createProject
      tags: [Projects]
      summary: Create a new project and associated database instance
      description: |
        Creates a project and starts asynchronous provisioning of the database instance.
        The response includes the project data wrapped in a `project` key. The initial
        instance `status` is `creating` until provisioning completes.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              name: "Analytics Service DB"
              description: "Primary PostgreSQL database for the analytics microservice"
              db_type: "sql"
              resource_tier: "basic"
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateProjectResponse'
              example:
                status: success
                message: Project created successfully
                data:
                  project:
                    id: "c3d4e5f6-a7b8-9012-cdef-345678901234"
                    user_id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                    name: "Analytics Service DB"
                    description: "Primary PostgreSQL database for the analytics microservice"
                    db_type: "sql"
                    resource_tier: "basic"
                    created_at: "2026-04-10T01:00:00Z"
                    status: "creating"
        '400':
          description: Invalid request body (bad db_type, resource_tier, etc.)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to create project or database instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: listProjects
      tags: [Projects]
      summary: List projects for the authenticated user
      description: |
        Returns all projects belonging to the authenticated user. Each project includes
        the current database instance `status`.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Project'
              example:
                status: success
                message: Projects retrieved successfully
                data:
                  - id: "c3d4e5f6-a7b8-9012-cdef-345678901234"
                    user_id: "a1b2c3d4-e5f6-7890-abcd-1234567890ab"
                    name: "Analytics Service DB"
                    db_type: "sql"
                    resource_tier: "basic"

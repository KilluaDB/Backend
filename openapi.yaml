        - name: schema
          in: query
          required: false
          schema:
            type: string
            default: public
            pattern: '^[a-zA-Z_][a-zA-Z0-9_$]*$'
          description: PostgreSQL schema to list tables from; defaults to `public` if omitted
          example: public
      responses:
        '200':
          description: Tables retrieved successfully; `data` is a JSON array of table name strings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostgresListTablesData'
              example:
                status: success
                message: Tables retrieved successfully
                data:
                  - customers
                  - orders
                  - products
        '400':
          description: Invalid project ID or schema name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Unauthorized
        '404':
          description: Project not accessible or database instance not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      operationId: createPostgresTable
      tags: [Postgres]
      summary: Create a new PostgreSQL table
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequestBody'
            examples:
              simpleTable:
                summary: Minimal table (no foreign keys)
                value:
                  schema: "public"
                  table: "events"
                  columns:
                    - name: "id"
                      type: "INTEGER"
                      primary: true
                      is_identity: true
                      nullable: false
                    - name: "name"
                      type: "TEXT"
                      nullable: false
              tableWithForeignKey:
                summary: Table with unique email and FK to accounts
                value:
                  schema: "public"
                  table: "customers"
                  columns:
                    - name: "id"
                      type: "INTEGER"
                      primary: true
                      is_identity: true
                      nullable: false
                    - name: "email"
                      type: "VARCHAR(255)"
                      is_unique: true
                      nullable: false
                    - name: "created_at"
                      type: "TIMESTAMPTZ"
                      default: "NOW()"
                      nullable: false
                  foreign_keys:
                    schema: "public"
                    table: "accounts"
                    references:
                      - local_column: "account_id"
                        foreign_column: "id"
                        on_update: "CASCADE"
                        on_delete: "CASCADE"
      responses:
        '201':
          description: Table created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostgresTableOpData'
              examples:
                default:
                  summary: Typical DDL result
                  value:
                    status: success
                    message: Table created successfully
                    data:
                      result:
                        rows_affected: 0
        '400':
          description: Invalid request body or project ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not accessible or database instance not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Table already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: Table already exists

  /api/v1/projects/{id}/postgres/text-to-sql:
    parameters:
      - name: id

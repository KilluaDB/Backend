  /api/v1/projects/{id}/access:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProjectAccess
      tags: [Projects]
      summary: Get external connection info for a project
      description: |
        Returns the external connection string and credentials for direct database access via Traefik TCP SNI.
        For PostgreSQL projects, additionally returns the PostgREST API URL, a pre-signed API key (JWT), and
        the raw JWT secret for signing custom tokens.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: External database connection details retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          connection_string:
                            type: string
                            description: Full connection URI (postgresql:// or mongodb://)
                            example: "postgresql://user:pass@host:5432/db?sslmode=require"
                          host:
                            type: string
                            example: "host.example.com"
                          port:
                            type: integer
                            example: 5432
                          database:
                            type: string
                            example: "db_name"
                          username:
                            type: string
                            example: "db_user"
                          password:
                            type: string
                            example: "db_password"
                          postgrest_url:
                            type: string
                            nullable: true
                            description: PostgREST API URL (present only for PostgreSQL projects)
                            example: "https://postgrest-abc123.example.com"
                          api_key:
                            type: string
                            nullable: true
                            description: Pre-signed JWT with role=app_user for PostgREST (present only for PostgreSQL projects)
                            example: "eyJhbGciOiJIUzI1NiIs..."
                          jwt_secret:
                            type: string
                            nullable: true
                            description: Raw JWT secret for signing custom PostgREST tokens (present only for PostgreSQL projects)
                            example: "super-secret-jwt-key-here"
              example:
                status: success
                message: Connection info retrieved successfully
                data:
                  connection_string: "postgresql://user:pass@host:5432/db?sslmode=require"
                  host: "host.example.com"
                  port: 5432
                  database: "db_name"
                  username: "db_user"
                  password: "db_password"
                  postgrest_url: "https://postgrest-abc123.example.com"
                  api_key: "eyJhbGciOiJIUzI1NiIs..."
                  jwt_secret: "super-secret-jwt-key-here"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Database is not running yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: External access not configured on the server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}/export:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        required: false
        schema:
          type: string
        description: |
          For PostgreSQL projects, selects either 'sql' (plain SQL, default) or 'custom' (pg_dump custom format).
          MongoDB projects ignore this parameter and always emit a gzipped mongodump archive.
    get:
      operationId: exportProjectDatabase
      tags: [Backups]
      summary: Export a project database backup
      description: |
        Streams a full database backup file for the specified project. PostgreSQL projects can be exported
        as plain SQL or a pg_dump custom format. MongoDB projects are exported as a gzipped mongodump archive.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: A binary database backup file stream
          headers:
            Content-Disposition:
              schema:
                type: string
                example: "attachment; filename=\"projectName-20260601-072745.sql\""
            Content-Type:
              schema:
                type: string
                example: "application/octet-stream"
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid project ID format or unsupported format parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Database instance is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/projects/{id}/import:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: format
        in: query
        required: false
        schema:
          type: string
        description: |
          For PostgreSQL projects, forces 'custom' (pg_restore) or 'sql' (psql).
          If omitted, the server will attempt to auto-detect by matching magic bytes of the file.
    post:
      operationId: importProjectDatabase
      tags: [Backups]
      summary: Import a database backup
      description: |
        Accepts a database backup file (either via multipart/form-data with the 'file' field,
        or as a raw binary body) and restores it into the project's database.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: The database backup file to import.
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Database backup imported and restored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponseSuccessMessageOnly'
              example:
                status: success
                message: Import completed successfully
        '400':
          description: Invalid input or failed to read upload body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Database instance is not running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'


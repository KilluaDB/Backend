  /api/v1/projects/{id}/postgres/tables/{table}/indexes:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: table
        in: path
        required: true
        schema:
          type: string
      - name: schema
        in: query

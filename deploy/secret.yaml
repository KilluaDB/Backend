# Create this secret from your .env (do not commit real values).
# Run: kubectl create secret generic backend-secrets --from-env-file=.env -n default --dry-run=client -o yaml | kubectl apply -f -
# Or create manually and replace the placeholder values below (base64-encoded).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: default
type: Opaque
stringData:
  DB_PASSWORD: "changeme"
  DB_ADMIN_PASSWORD: "changeme"
  ACCESS_TOKEN_SECRET: "changeme-min-32-chars-long-secret"
  REFRESH_TOKEN_SECRET: "changeme-min-32-chars-long-secret"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

# ServiceAccount for the backend (used by Deployment in default).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: default
---
# Postgres: ClusterRole for namespace-per-project (backend creates/deletes namespaces dynamically).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backend-db-manager
rules:
  # Namespace lifecycle (create/delete per-project namespaces)
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["create", "get", "list", "delete"]
  # CNPG Cluster CRs
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # Secrets (DB credentials, PostgREST config)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # PostgREST Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  # PostgREST Services
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # Traefik routes (TCP for Postgres direct access + HTTP for PostgREST)
  - apiGroups: ["traefik.containo.us"]
    resources: ["ingressroutetcps", "ingressroutes"]
    verbs: ["create", "get", "list", "watch", "delete"]
  # MongoDB CRs (still in shared namespace)
  - apiGroups: ["mongodbcommunity.mongodb.com"]
    resources: ["mongodbcommunity"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: backend-db-manager
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: default
roleRef:
  kind: ClusterRole
  name: backend-db-manager
  apiGroup: rbac.authorization.k8s.io
---
# MongoDB instances namespace: backend can create/manage MongoDBCommunity and secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-db-instances
  namespace: mongodb-instances
rules:
  - apiGroups: ["mongodbcommunity.mongodb.com"]
    resources: ["mongodbcommunity"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: ["traefik.containo.us"]
    resources: ["ingressroutetcps"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-db-instances
  namespace: mongodb-instances
subjects:
  - kind: ServiceAccount
    name: backend
    namespace: default
roleRef:
  kind: Role
  name: backend-db-instances
  apiGroup: rbac.authorization.k8s.io

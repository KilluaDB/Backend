apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: default
data:
  PORT: "8080"
  DB_HOST: "host.minikube.internal"   # minikube: use this for meta-DB on host; or use a K8s service name if meta-DB is in cluster
  DB_PORT: "5432"
  DB_DATABASE: "dbaas"
  DB_USERNAME: "postgres"
  DB_ADMIN_USER: "postgres"
  DB_INSTANCES_NAMESPACE: "default"
  # When port-forwarding the API to localhost:8080, set this so OAuth redirect works:
  GOOGLE_REDIRECT_URL: "http://localhost:8080/api/v1/auth/google/callback"

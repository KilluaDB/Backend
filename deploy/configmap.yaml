apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: default
data:
  PORT: "8080"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_DATABASE: "dbaas"
  REDIS_ADDR: "redis:6379"
  DB_USERNAME: "postgres"
  DB_INSTANCES_NAMESPACE_POSTGRES: "postgres-instances"
  DB_INSTANCES_NAMESPACE_MONGO: "mongodb-instances"
  GOOGLE_REDIRECT_URL: "http://localhost:8081/api/v1/auth/google/callback"
  AI: "http://ai.default.svc.cluster.local:8080"